<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Receipt | Roland's Steak House</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/receipt.css">
    <link rel="stylesheet" href="css/design-system.css">
    <script src="js/design-system.js"></script>
    <script src="js/inventory-system.js"></script>
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <div class="receipt-wrapper">
        <div class="receipt-paper" id="receipt-capture-area">
            <div class="center">
                <h1>ROLAND'S</h1>
                <p>EST. 1994<br>Premium Steak House</p>
                <p>123 Culinary Hub, Main St.<br>Tel: (02) 8123-4567</p>
            </div>

            <div class="divider"></div>

            <div class="info-row">
                <span>ORDER #</span>
                <span id="order-num" style="font-weight: bold;"></span>
            </div>
            <div class="info-row">
                <span>TABLE</span>
                <span id="table-id" style="font-weight: bold;"></span>
            </div>
            <div class="info-row">
                <span>CUSTOMER</span>
                <span id="customer-name"></span>
            </div>
            <div class="info-row">
                <span>DATE</span>
                <span id="date-now"></span>
            </div>

            <div class="divider"></div>

            <div style="font-weight: bold; margin-bottom: 10px;">ITEM DESCRIPTION</div>
            <ul class="order-list" id="order-items-list">
                <!-- Javascript will inject items -->
            </ul>

            <div class="divider"></div>

            <div class="info-row" style="font-size: 12px; color: #475569; margin-bottom: 4px;">
                <span>VATABLE SALES</span>
                <span>PHP <span id="vatable-sales">0.00</span></span>
            </div>
            <div class="info-row" style="font-size: 12px; color: #475569; margin-bottom: 8px;">
                <span>VAT (12% INCL.)</span>
                <span>PHP <span id="vat-amount">0.00</span></span>
            </div>

            <div class="total-row">
                <span>AMOUNT PAID</span>
                <span>PHP <span id="total-amount"></span></span>
            </div>

            <div class="divider"></div>

            <div class="center" style="margin-top: 20px;">
                <p>Thank you for dining with us!<br>Please present this receipt.</p>
                
                <!-- POS Scannable QR CODE -->
                <div id="qrcode-container" style="margin-top: 25px; display: flex; justify-content: center;">
                    <div id="qrcode"></div>
                </div>
                <p style="font-size: 10px; color: #94a3b8; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px;">Scan to Verify Order</p>
            </div>
        </div>

        <div class="btn-area">
            <button class="print-btn" onclick="window.print()">🖨️ PRINT RECEIPT</button>
            <button class="print-btn" style="background:#334155;" onclick="downloadReceiptAsPhoto()">📥 DOWNLOAD RECEIPT</button>
            <button id="btn-cancel-reservation-receipt" class="home-btn" style="background:#dc2626; color:white; border:none; margin-top:4px;" onclick="cancelReceiptReservation()">🚫 CANCEL RESERVATION</button>
            <button class="home-btn" onclick="window.location.href='index.html'">RETURN HOME</button>
        </div>
    </div>

    <script>
        function downloadReceiptAsPhoto() {
            const wrapper = document.querySelector('.receipt-wrapper');
            const paper = document.getElementById('receipt-capture-area');
            const btnArea = document.querySelector('.btn-area');

            if (!paper) return;

            const reservationNumber = localStorage.getItem('reservationNumber') || 'TBD';
            
            wrapper.style.filter = 'none'; // Remove wrapper filter to prevent buggy html2canvas rendering
            btnArea.style.display = 'none'; // Hide buttons

            html2canvas(paper, {
                backgroundColor: '#ffffff',
                scale: 4, // Increased scale for super sharp image quality
                useCORS: true, // Prevents custom font rendering issues
                logging: false
             }).then(canvas => {
                const link = document.createElement('a');
                link.download = `receipt-${reservationNumber}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                wrapper.style.filter = ''; 
                btnArea.style.display = '';
             }).catch(() => {
                wrapper.style.filter = ''; 
                btnArea.style.display = '';
                superModal({ title: 'Download Error 📥', message: 'Could not save the receipt photo. Please try again.' });
             });
        }

        // Load from URL param if available, otherwise fallback to temporary localStorage keys
        const urlParams = new URLSearchParams(window.location.search);
        const urlRes = urlParams.get('res');
        
        let name = localStorage.getItem('customerName') || 'Valued Guest';
        let table = localStorage.getItem('bookedTable') || 'TBD';
        let total = localStorage.getItem('totalBill') || '0';
        let orders = localStorage.getItem('orderSummary') || 'No items selected';
        let reservationNumber = localStorage.getItem('reservationNumber') || 'TBD';
        let arrivalDisplay = localStorage.getItem('arrivalDateTimeDisplay') || new Date().toLocaleString('en-GB', { hour12: false });

        if (urlRes) {
            reservationNumber = urlRes;
            const hist = JSON.parse(localStorage.getItem('reservationHistory') || '[]');
            const myRes = hist.find(r => r.reservationNumber === urlRes);
            if (myRes) {
                name = myRes.customerName || 'Valued Guest';
                table = myRes.bookedTable || 'TBD';
                total = myRes.paymentAmount || myRes.totalBill || myRes.amount || myRes.subtotalAmount || '0';
                orders = (myRes.foods && myRes.foods.length) ? myRes.foods.join(', ') : (myRes.orderSummary || 'Standard Reservation');
                reservationNumber = myRes.reservationNumber;
                arrivalDisplay = myRes.arrivalDateTimeDisplay || new Date().toLocaleString('en-GB', { hour12: false });
            }
        }

        function updateReceiptTotalsUI(amountVal, ordersText) {
            const cleanTotal = parseFloat(String(amountVal || '0').replace(/[^0-9.]/g, '')) || 0;
            const checkOrders = String(ordersText !== undefined ? ordersText : orders || '').toLowerCase();
            const isStandardFixedFee = (cleanTotal === 200 && (!myRes || !Array.isArray(myRes.foods) || myRes.foods.length === 0)) ||
                                       checkOrders.includes('standard reservation');

            const vatableEl = document.getElementById('vatable-sales');
            const vatEl = document.getElementById('vat-amount');

            if (isStandardFixedFee) {
                // 👉 Hide VAT breakdown for the ₱200 Fixed Standard Reservation Fee!
                if (vatableEl && vatableEl.parentElement && vatableEl.parentElement.parentElement) {
                    vatableEl.parentElement.parentElement.style.display = 'none';
                }
                if (vatEl && vatEl.parentElement && vatEl.parentElement.parentElement) {
                    vatEl.parentElement.parentElement.style.display = 'none';
                }
            } else {
                const vatableSales = cleanTotal / 1.12;
                const vatAmt = cleanTotal - vatableSales;

                if (vatableEl) {
                    if (vatableEl.parentElement && vatableEl.parentElement.parentElement) {
                        vatableEl.parentElement.parentElement.style.display = 'flex';
                    }
                    vatableEl.textContent = vatableSales.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
                if (vatEl) {
                    if (vatEl.parentElement && vatEl.parentElement.parentElement) {
                        vatEl.parentElement.parentElement.style.display = 'flex';
                    }
                    vatEl.textContent = vatAmt.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
            }

            if (document.getElementById('total-amount')) {
                document.getElementById('total-amount').textContent = cleanTotal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }

        // Initialize QR Code
        const qrContainer = document.getElementById("qrcode");
        if (qrContainer) {
            qrContainer.innerHTML = '';
            if (typeof QRCode !== 'undefined') {
                new QRCode(qrContainer, {
                    text: reservationNumber || 'TBD',
                    width: 120,
                    height: 120,
                    colorDark: "#1e293b",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } else {
                // Fallback QR generator if CDN script failed or offline
                const qrImg = document.createElement('img');
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(reservationNumber || 'TBD')}`;
                qrImg.alt = 'QR Code';
                qrImg.style.width = '120px';
                qrImg.style.height = '120px';
                qrContainer.appendChild(qrImg);
            }
        }
        // Check if reservation is cancelled
        const hist = JSON.parse(localStorage.getItem('reservationHistory') || '[]');
        const currentRes = hist.find(r => r.reservationNumber === reservationNumber);
        const cancelBtn = document.getElementById('btn-cancel-reservation-receipt');

        const isCancelled = currentRes && (currentRes.approvalStatus === 'rejected' || currentRes.approvalStatus === 'cancelled' || currentRes.kdsStatus === 'cancelled' || currentRes.status === 'cancelled' || currentRes.isCancelled === true || Boolean(currentRes.cancelledAt));
        const isCompleted = currentRes && (Boolean(currentRes.completedAt) || currentRes.approvalStatus === 'completed' || currentRes.kdsStatus === 'served');

        if (isCancelled || isCompleted) {
            if (cancelBtn) cancelBtn.style.display = 'none';
        }

        if (isCancelled) {
            const paper = document.getElementById('receipt-capture-area');
            if (paper) {
                const isRefunded = currentRes.refundStatus === 'refunded' || currentRes.paymentStatus === 'refunded';
                const isRefundPending = currentRes.refundStatus === 'pending_refund';
                const refundAmt = Number(currentRes.refundAmount || currentRes.paymentAmount || 0);

                const stamp = document.createElement('div');
                stamp.style.cssText = `border:3px solid ${isRefunded ? '#2563eb' : '#dc2626'}; color:${isRefunded ? '#2563eb' : '#dc2626'}; font-size:22px; font-weight:900; text-transform:uppercase; letter-spacing:2px; padding:8px 16px; border-radius:8px; text-align:center; margin:16px auto; width:fit-content; transform:rotate(-5deg);`;
                stamp.textContent = isRefunded ? 'CANCELLED - REFUNDED' : (isRefundPending ? 'CANCELLED - REFUND PENDING' : 'CANCELLED - INVALID');
                paper.insertBefore(stamp, paper.firstChild);

                if (isRefunded) {
                    const refCard = document.createElement('div');
                    refCard.style.cssText = 'background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:10px 12px; margin:12px 0; font-size:12px; color:#1e40af; line-height:1.4;';
                    refCard.innerHTML = `
                        <strong>💸 Refund Processed:</strong> ₱${refundAmt.toLocaleString(undefined, { minimumFractionDigits: 2 })} via ${(currentRes.refundMethod || 'GCash').toUpperCase()}
                        ${currentRes.refundRef ? `<br><span>Ref: ${currentRes.refundRef}</span>` : ''}
                    `;
                    paper.insertBefore(refCard, paper.children[1] || null);
                } else if (isRefundPending) {
                    const refCard = document.createElement('div');
                    refCard.style.cssText = 'background:#fef3c7; border:1px solid #fde68a; border-radius:8px; padding:10px 12px; margin:12px 0; font-size:12px; color:#92400e; line-height:1.4;';
                    refCard.innerHTML = `
                        <strong>⚠️ Refund Status:</strong> Your cancellation was recorded. Our staff is processing your refund of ₱${refundAmt.toLocaleString(undefined, { minimumFractionDigits: 2 })}.
                    `;
                    paper.insertBefore(refCard, paper.children[1] || null);
                }
            }
        }

        async function cancelReceiptReservation() {
            const resNum = reservationNumber;
            if (!resNum || resNum === 'TBD') {
                alert('No active reservation found.');
                return;
            }

            const reason = prompt(`Please enter the reason for cancelling reservation #${resNum}:`, 'Customer requested cancellation from receipt page');
            if (!reason) return;

            let res = { success: true };
            if (window.InventorySystem && typeof window.InventorySystem.cancelReservationWithFood === 'function') {
                res = window.InventorySystem.cancelReservationWithFood({
                    reservationNumber: resNum,
                    reason: reason,
                    cancelledBy: 'customer',
                    operator: 'Customer Receipt Portal'
                });
            }

            // 👉 Sync cancellation to live MySQL database so it doesn't come back!
            try {
                await Promise.all([
                    fetch('https://rolands-steakhouse-vqtr.vercel.app/api/reservations/update-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: resNum, status: 'Cancelled' })
                    }),
                    fetch('https://rolands-steakhouse-vqtr.vercel.app/api/reservations/update-kds', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: resNum, kdsStatus: 'cancelled' })
                    })
                ]);
            } catch (e) {}

            if (res && res.success) {
                alert(`✅ Reservation #${resNum} has been cancelled successfully.\n\nYour table has been released and all pre-ordered foods have been cancelled.`);
                window.location.reload();
            } else {
                alert('Could not cancel reservation: ' + (res?.error || 'Unknown error'));
            }
        }

        // 👉 Auto-fetch from MySQL if this QR receipt is scanned on a different device!
        (async function ensureCloudReceiptData() {
            if (!urlRes) return;
            const hist = JSON.parse(localStorage.getItem('reservationHistory') || '[]');
            const existsLocally = hist.some(r => r.reservationNumber === urlRes);
            if (!existsLocally) {
                try {
                    const r = await fetch('https://rolands-steakhouse-vqtr.vercel.app/reservations?nocache=' + Date.now());
                    if (!r.ok) return;
                    const dbList = await r.json();
                    const found = Array.isArray(dbList) ? dbList.find(x => x.reservationNumber === urlRes) : null;
                    if (found) {
                        if (document.getElementById('order-num')) document.getElementById('order-num').textContent = found.reservationNumber;
                        if (document.getElementById('customer-name')) document.getElementById('customer-name').textContent = found.customerName || 'Valued Guest';
                        if (document.getElementById('table-id')) document.getElementById('table-id').textContent = found.bookedTable || 'TBD';
                        if (document.getElementById('total-amount')) document.getElementById('total-amount').textContent = Number(found.paymentAmount || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        if (document.getElementById('date-now')) document.getElementById('date-now').textContent = `${found.arrivalDate || ''} ${found.arrivalTime || ''}`.trim();
                        const listEl = document.getElementById('order-items-list');
                        if (listEl) {
                            const items = (Array.isArray(found.foods) && found.foods.length) ? found.foods : ['Standard Reservation'];
                            listEl.innerHTML = items.map(item => `<li class="order-item"><span>${item.trim()}</span> <span>(Paid)</span></li>`).join('');
                        }
                    }
                } catch (e) {}
            }
        })();
    </script>
</body>

</html>
