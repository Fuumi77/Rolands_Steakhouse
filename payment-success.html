<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Roland's</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <script src="js/design-system.js"></script>
    <script src="js/inventory-system.js"></script>
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/payment-success.css">
</head>
<body>
    <style>
        /* 👉 LOGO SCALER & HOVER/CLICK ANIMATION (payment-success.html) */
        :root {
            --success-logo-scale: 1.85;       /* 👈 Change this number to adjust normal size */
            --success-logo-hover-scale: 2.05; /* 👈 Size when hovered */
            --success-logo-click-scale: 2.20; /* 👈 Size when clicked */
        }

        .success-brand-logo {
            height: 85px !important;
            width: auto !important;
            cursor: pointer !important;
            transform: scale(var(--success-logo-scale)) !important;
            transform-origin: center center !important;
            filter: drop-shadow(0 4px 10px rgba(27, 94, 32, 0.15)) !important;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease !important;
        }

        .success-brand-logo:hover {
            transform: scale(var(--success-logo-hover-scale)) !important;
            filter: drop-shadow(0 8px 18px rgba(27, 94, 32, 0.28)) !important;
        }

        .success-brand-logo:active {
            transform: scale(var(--success-logo-click-scale)) !important;
        }
    </style>
    <div class="success-card">
        <div style="margin-top: 10px; margin-bottom: 38px; display: flex; justify-content: center;">
            <img src="images/Rolands logo 2.png" alt="Roland's Logo" class="success-brand-logo" onclick="window.location.href='index.html'">
        </div>
        <div class="check-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <h1>Payment Successful!</h1>
        <p class="sub">Your priority reservation at Roland's Steakhouse has been confirmed. We look forward to serving you!</p>
        <div class="res-badge">
            <div class="label">Reservation Number</div>
            <div class="code" id="res-number">Loading...</div>
        </div>

        <!-- Receipt Section -->
        <div id="receipt-area" style="display:none; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:16px; padding:20px; margin-bottom:28px; text-align:left;">
            <div style="font-weight:800; font-size:12px; color:#1b5e20; text-transform:uppercase; margin-bottom:12px; display:flex; justify-content:space-between;">
                <span>E-Receipt</span>
                <span id="receipt-date" style="color:#94a3b8; font-weight:400;"></span>
            </div>
            <div id="receipt-items" style="font-size:14px; color:#334155; line-height:1.6;">
                <!-- Filled by JS -->
            </div>
            <div style="border-top:1px dashed #cbd5e1; margin-top:12px; padding-top:10px; font-size:12.5px; color:#64748b;">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span>Vatable Sales</span>
                    <span id="receipt-vatable">₱0.00</span>
                </div>
                <div style="display:flex; justify-content:space-between;">
                    <span>VAT (12% Incl.)</span>
                    <span id="receipt-vat">₱0.00</span>
                </div>
            </div>
            <div style="border-top:1px solid #e2e8f0; margin-top:10px; padding-top:10px; display:flex; justify-content:space-between; font-weight:800; color:#1b5e20; font-size:18px;">
                <span>Total Paid</span>
                <span id="receipt-total">₱0.00</span>
            </div>
        </div>
        <a href="index.html" class="home-btn">🏠 Return to Homepage</a>
        <p class="pm-note">Payment processed securely via PayMongo</p>
    </div>

<script>
        const API_BASE_URL = 'https://rolands-steakhouse-vqtr.vercel.app';
        
        // Clear paymongoSessionId so returning to checkout doesn't trigger a false failure
        localStorage.removeItem('paymongoSessionId');

        // Helper: Automatically generates a visual "Payment Successful / E-Receipt" image as Proof of Payment
        function generateEReceiptProofImage(entry) {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 760;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#f0fdf4';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // White Card Container
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#bbf7d0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(30, 30, 540, 700, 20);
            ctx.fill();
            ctx.stroke();

            // Top Green Header Bar
            ctx.fillStyle = '#1b5e20';
            ctx.beginPath();
            ctx.roundRect(30, 30, 540, 14, [20, 20, 0, 0]);
            ctx.fill();

            // Green Check Circle
            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.arc(300, 105, 34, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(285, 105);
            ctx.lineTo(296, 116);
            ctx.lineTo(317, 94);
            ctx.stroke();

            // Title & Subtitle
            ctx.fillStyle = '#1b5e20';
            ctx.font = 'bold 28px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('Payment Successful!', 300, 175);

            ctx.fillStyle = '#64748b';
            ctx.font = '14px Arial, sans-serif';
            ctx.fillText("Roland's Steakhouse Official E-Receipt", 300, 200);

            // Reservation Number Badge
            ctx.fillStyle = '#f0fdf4';
            ctx.strokeStyle = '#86efac';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(110, 222, 380, 78, 14);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 11px Arial, sans-serif';
            ctx.fillText('RESERVATION NUMBER', 300, 248);

            ctx.fillStyle = '#15803d';
            ctx.font = 'bold 28px Arial, sans-serif';
            ctx.fillText(entry.reservationNumber || 'N/A', 300, 283);

            // E-Receipt Box
            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.roundRect(65, 325, 470, 330, 14);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);

            // E-Receipt Header
            ctx.textAlign = 'left';
            ctx.fillStyle = '#1b5e20';
            ctx.font = 'bold 13px Arial, sans-serif';
            ctx.fillText('E-RECEIPT', 90, 358);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#94a3b8';
            ctx.font = '13px Arial, sans-serif';
            ctx.fillText(new Date().toLocaleDateString(), 510, 358);

            // Details
            ctx.textAlign = 'left';
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 15px Arial, sans-serif';
            ctx.fillText('Customer: ', 90, 395);
            ctx.font = '15px Arial, sans-serif';
            ctx.fillText(entry.customerName || 'Guest', 175, 395);

            ctx.font = 'bold 15px Arial, sans-serif';
            ctx.fillText('Table: ', 90, 425);
            ctx.font = '15px Arial, sans-serif';
            ctx.fillText(entry.bookedTable || 'TBD', 145, 425);

            ctx.font = 'bold 15px Arial, sans-serif';
            ctx.fillText('Arrival: ', 90, 455);
            ctx.font = '15px Arial, sans-serif';
            ctx.fillText(entry.arrivalDateTimeDisplay || 'Upcoming', 155, 455);

            // Divider
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(90, 475);
            ctx.lineTo(510, 475);
            ctx.stroke();

            // Order Summary (Wrapped)
            ctx.fillStyle = '#475569';
            ctx.font = '13.5px Arial, sans-serif';
            const summaryText = entry.orderSummary || (Array.isArray(entry.foods) && entry.foods.length ? entry.foods.join(', ') : 'Standard Reservation Deposit');
            const words = summaryText.split(' ');
            let line = '';
            let y = 502;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > 415 && n > 0) {
                    ctx.fillText(line, 90, y);
                    line = words[n] + ' ';
                    y += 20;
                    if (y > 550) break;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 90, y);

            // Bottom VAT & Total Divider (No VAT on ₱200 Standard Reservation Fee)
            const totalNum = Number(entry.paymentAmount || 0);
            const isStandardFixedFee = (String(entry.reservationType || '').toLowerCase() === 'standard' && (!entry.foods || entry.foods.length === 0)) || totalNum === 200;

            ctx.strokeStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(90, 560);
            ctx.lineTo(510, 560);
            ctx.stroke();

            if (isStandardFixedFee) {
                ctx.fillStyle = '#64748b';
                ctx.font = '13px Arial, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('Fee Type:', 90, 592);
                ctx.textAlign = 'right';
                ctx.fillText('Fixed Reservation Fee (No VAT)', 510, 592);
            } else {
                const vatableNum = totalNum / 1.12;
                const vatNum = totalNum - vatableNum;

                ctx.fillStyle = '#64748b';
                ctx.font = '13px Arial, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('Vatable Sales:', 90, 582);
                ctx.fillText('VAT (12% Incl.):', 90, 602);

                ctx.textAlign = 'right';
                ctx.fillText('₱' + vatableNum.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }), 510, 582);
                ctx.fillText('₱' + vatNum.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }), 510, 602);
            }

            ctx.fillStyle = '#1b5e20';
            ctx.font = 'bold 20px Arial, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Total Paid', 90, 634);

            ctx.textAlign = 'right';
            const fmtTotal = '₱' + totalNum.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            ctx.fillText(fmtTotal, 510, 634);

            // Footer
            ctx.textAlign = 'center';
            ctx.fillStyle = '#64748b';
            ctx.font = '12px Arial, sans-serif';
            ctx.fillText('Processed via PayMongo • Verified Digital E-Receipt', 300, 695);

            return canvas.toDataURL('image/png');
        }

        // Main initialization (Waits for PayMongo redirect to save to MySQL first, then renders receipt!)
        (async function initPaymentSuccessPage() {
            const params = new URLSearchParams(window.location.search);
            const pendingJson = sessionStorage.getItem('pendingPaymongoOrder');

            // 1. If returning from PayMongo checkout, save reservation to MySQL NOW (after payment completed!)
            if (params.get('source') === 'paymongo' && pendingJson && !params.get('resno')) {
                try {
                    const pending = JSON.parse(pendingJson);
                    sessionStorage.removeItem('pendingPaymongoOrder');

                    const dbRes = await fetch(`${API_BASE_URL}/reserve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: pending.name,
                            email: pending.email,
                            date: pending.date,
                            time: pending.time,
                            table: pending.table,
                            cartItems: pending.cartItems || [],
                            status: 'Pending',
                            reservationType: pending.reservationType,
                            paymentAmount: pending.paymentAmount,
                            foods: pending.foods || []
                        })
                    });
                    const dbData = await dbRes.json();
                    const newResNo = 'RES-' + dbData.reservationId;

                    const hist = JSON.parse(localStorage.getItem('reservationHistory') || '[]');
                    hist.push({
                        reservationNumber: newResNo,
                        reservationType: pending.reservationType,
                        bookedBy: 'online',
                        arrivalDate: pending.date,
                        arrivalTime: pending.time,
                        arrivalDateTimeDisplay: pending.displayDt,
                        customerName: pending.name,
                        email: pending.email,
                        contactNumber: pending.phone || '',
                        bookedTable: pending.table,
                        orderSummary: pending.orderSummary,
                        foods: pending.foods || [],
                        cartItems: pending.cartItems || [],
                        beefNote: pending.beefNote || '',
                        paymentAmount: pending.paymentAmount,
                        paymentRef: 'E-RECEIPT-' + newResNo,
                        paymentStatus: 'pending',
                        approvalStatus: 'pending',
                        paymentMethod: 'paymongo',
                        createdAt: new Date().toISOString()
                    });
                    localStorage.setItem('reservationHistory', JSON.stringify(hist));
                    localStorage.setItem('reservationNumber', newResNo);
                    localStorage.setItem('activeCustomerReservation', newResNo);

                    window.location.replace(`payment-success.html?resno=${newResNo}`);
                    return; // Stop here until page reloads with ?resno=RES-#
                } catch (e) {
                    console.error('Failed to finalize reservation:', e);
                }
            }

            // 2. Render the confirmed reservation receipt
            const resNo = params.get('resno') || localStorage.getItem('reservationNumber') || 'N/A';
            document.getElementById('res-number').textContent = resNo;

            const hist = JSON.parse(localStorage.getItem('reservationHistory') || '[]');
            let entry = hist.find(r => r.reservationNumber === resNo);

            if (!entry && resNo !== 'N/A') {
                const summaryStr = localStorage.getItem('orderSummary') || 'Standard Reservation';
                entry = {
                    reservationNumber: resNo,
                    reservationType: localStorage.getItem('reservationType') || 'priority',
                    bookedBy: 'online',
                    customerName: localStorage.getItem('customerName') || localStorage.getItem('loggedInUserName') || 'Guest',
                    bookedTable: localStorage.getItem('bookedTable') || 'TBD',
                    arrivalDate: localStorage.getItem('arrivalDate') || '',
                    arrivalTime: localStorage.getItem('arrivalTime') || '',
                    arrivalDateTimeDisplay: localStorage.getItem('arrivalDateTimeDisplay') || 'Upcoming',
                    orderSummary: summaryStr,
                    foods: summaryStr ? summaryStr.split(', ').filter(Boolean) : [],
                    paymentAmount: Number(localStorage.getItem('totalBill') || 0),
                    paymentStatus: 'pending',
                    approvalStatus: 'pending',
                    paymentMethod: 'paymongo',
                    createdAt: new Date().toISOString()
                };
                hist.push(entry);
            }

            if (entry) {
                entry.paymentStatus = 'pending';
                entry.approvalStatus = 'pending';
                entry.paymentMethod = entry.paymentMethod || 'paymongo';
                entry.paymentRef = entry.paymentRef || ('E-RECEIPT-' + resNo);

                try {
                    entry.paymentProof = generateEReceiptProofImage(entry);
                } catch (e) {
                    console.warn('Could not generate E-Receipt image:', e);
                }

                if (!entry.stockDeducted && entry.cartItems && entry.cartItems.length > 0) {
                    if (window.InventorySystem && typeof window.InventorySystem.deductIngredientsForOrder === 'function') {
                        window.InventorySystem.deductIngredientsForOrder(entry.cartItems, 'Online Pre-Order', resNo);
                    }
                    entry.stockDeducted = true;
                }

                localStorage.setItem('reservationHistory', JSON.stringify(hist));

                const customerEmail = localStorage.getItem('customerEmail') || localStorage.getItem('loggedInUserEmail');
                if (customerEmail) {
                    fetch(`${API_BASE_URL}/api/send-receipt`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: customerEmail,
                            customerName: entry.customerName || 'Guest',
                            amount: entry.paymentAmount || 0,
                            reservationNumber: entry.reservationNumber,
                            paymentMethod: 'PayMongo (E-Receipt)',
                            arrivalDateTime: entry.arrivalDateTimeDisplay || 'TBD',
                            table: entry.bookedTable || 'Unassigned',
                            orderSummary: entry.orderSummary || 'Standard Reservation'
                        })
                    }).catch(err => console.error('Failed to trigger email', err));
                }

                document.getElementById('receipt-area').style.display = 'block';
                document.getElementById('receipt-date').textContent = new Date().toLocaleDateString();
                const totalPaidVal = Number(entry.paymentAmount || 0);
                const isStdFee = (String(entry.reservationType || '').toLowerCase() === 'standard' && (!entry.foods || entry.foods.length === 0)) || totalPaidVal === 200;
                const vatableEl = document.getElementById('receipt-vatable');
                const vatEl = document.getElementById('receipt-vat');

                if (isStdFee) {
                    if (vatableEl && vatableEl.parentElement && vatableEl.parentElement.parentElement) {
                        vatableEl.parentElement.parentElement.style.display = 'none';
                    }
                } else {
                    const vatableVal = totalPaidVal / 1.12;
                    const vatVal = totalPaidVal - vatableVal;
                    if (vatableEl) vatableEl.textContent = '₱' + vatableVal.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
                    if (vatEl) vatEl.textContent = '₱' + vatVal.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
                }
                document.getElementById('receipt-total').textContent = '₱' + totalPaidVal.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
                
                let itemsHtml = `<div style="margin-bottom:4px;"><strong>Customer:</strong> ${entry.customerName}</div>`;
                itemsHtml += `<div style="margin-bottom:4px;"><strong>Table:</strong> ${entry.bookedTable}</div>`;
                itemsHtml += `<div style="margin-bottom:4px;"><strong>Arrival:</strong> ${entry.arrivalDateTimeDisplay}</div>`;
                if (entry.orderSummary) {
                    itemsHtml += `<div style="margin-top:8px; padding-top:8px; border-top:1px solid #f1f5f9; color:#64748b; font-size:13px;">${entry.orderSummary}</div>`;
                }
                itemsHtml += `<div style="margin-top:15px; text-align:center;">
                    <a href="receipt.html?res=${resNo}" style="color:#1b5e20; font-size:12px; font-weight:700; text-decoration:none; border-bottom:1px dashed #1b5e20;">🖨️ View QR Receipt for Scanning</a>
                </div>`;
                
                document.getElementById('receipt-items').innerHTML = itemsHtml;

                const email = localStorage.getItem('loggedInUserEmail');
                const name = localStorage.getItem('loggedInUserName');
                let sId = localStorage.getItem('chatSessionId');
                if (email && email.trim() !== '') {
                    sId = 'acct_' + email.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
                } else if (name && name.trim() !== '') {
                    sId = 'acct_' + name.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
                } else if (!sId) {
                    sId = 'session_' + Math.random().toString(36).substr(2, 9);
                }
                localStorage.setItem('chatSessionId', sId);

                const allChats = JSON.parse(localStorage.getItem('liveChats') || '{}');
                if (!Array.isArray(allChats[sId])) allChats[sId] = [];

                const resNoStr = entry.reservationNumber;
                const hasReceipt = allChats[sId].some(m => m.res_no === resNoStr && m.text.includes('Receipt'));

                if (!hasReceipt) {
                    const receiptCardHtml = `
                        <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; padding: 15px; margin-top: 5px; box-shadow: 0 4px 12px rgba(22,163,74,0.1);">
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
                                <div style="background: #16a34a; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;">✅</div>
                                <strong style="color: #1b5e20; font-size: 15px;">Payment Submitted</strong>
                            </div>
                            <p style="font-size: 13px; color: #374151; margin-bottom: 12px; line-height: 1.4;">
                                Your E-Receipt for <strong>${resNoStr}</strong> has been sent to our staff for verification. Here is your QR receipt:
                            </p>
                            <button onclick="window.location.href='receipt.html?res=${resNoStr}'" 
                                    style="width: 100%; background: #1b5e20; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                                📋 View QR Receipt
                            </button>
                        </div>
                    `;
                    
                    const receiptMsg = {
                        sender: 'staff',
                        text: receiptCardHtml,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        res_no: resNoStr
                    };

                    allChats[sId].push(receiptMsg);
                    localStorage.setItem('liveChats', JSON.stringify(allChats));

                    fetch(`${API_BASE_URL}/api/memory/live-chats/message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: sId, message: receiptMsg })
                    }).catch(() => {});
                }
            }

            // Clear temporary checkout data
            localStorage.removeItem('totalBill');
            localStorage.removeItem('preOrderCart');
            localStorage.removeItem('currentCartObj');
            localStorage.removeItem('cartItems');
            localStorage.removeItem('reservationData');
            localStorage.removeItem('pendingReservation');
            localStorage.removeItem('pendingReservationNumber');

            if (resNo && resNo !== 'N/A') {
                localStorage.setItem('reservationNumber', resNo);
                localStorage.setItem('activeCustomerReservation', resNo);
            }
        })();
</script>
</body>
</html>
