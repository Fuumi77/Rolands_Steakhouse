<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cook Area | Roland's Steak House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/kitchen.css?v=2.0">
    <link rel="stylesheet" href="css/design-system.css?v=2.0">
    <script src="js/design-system.js?v=2.1"></script>
    <script src="js/inventory-system.js?v=6.7"></script>
    <link rel="stylesheet" href="css/responsive.css?v=2.0">
    <style>
        /* 👉 Smart Priority & Reservation Details Styling */
        .kds-res-info-box {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 9px 12px;
            margin: 10px 0 12px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
        }
        .kds-res-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .kds-type-pill {
            font-size: 10.5px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .kds-type-pill.now {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.35);
        }
        .kds-type-pill.prep {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.35);
        }
        .kds-type-pill.scheduled {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }
        .timer-badge.scheduled {
            background: rgba(51, 65, 85, 0.7) !important;
            color: #cbd5e1 !important;
            border: 1px solid rgba(148, 163, 184, 0.3) !important;
        }
        .ticket.is-future-scheduled {
            opacity: 0.85;
            border-top-color: #64748b !important;
        }
    </style>
</head>
<body>

    <!-- MODAL ROOT FOR CONFIRMATION DIALOGS -->
    <div id="super-modal-root"></div>

    <!-- AUTHENTICATION OVERLAY GATE -->
    <div id="auth-gate">
        <div class="auth-card">
            <h1>Cook Access</h1>
            <p style="color: #ef4444; font-weight: 700; margin-bottom: 6px;">[SECURITY GATE ACTIVE]</p>
            <p>Enter the 4-digit Kitchen Access Code set by Super Admin to continue.</p>
            <div class="pin-dots" id="pin-dots">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <input type="password" id="kitchen-pass-input" maxlength="4" readonly autocomplete="off">
            <div class="numpad">
                <button class="num-btn" type="button" onclick="appendPin('1')">1</button>
                <button class="num-btn" type="button" onclick="appendPin('2')">2</button>
                <button class="num-btn" type="button" onclick="appendPin('3')">3</button>
                <button class="num-btn" type="button" onclick="appendPin('4')">4</button>
                <button class="num-btn" type="button" onclick="appendPin('5')">5</button>
                <button class="num-btn" type="button" onclick="appendPin('6')">6</button>
                <button class="num-btn" type="button" onclick="appendPin('7')">7</button>
                <button class="num-btn" type="button" onclick="appendPin('8')">8</button>
                <button class="num-btn" type="button" onclick="appendPin('9')">9</button>
                <button class="num-btn" type="button" style="background:transparent; border:none;" disabled></button>
                <button class="num-btn" type="button" onclick="appendPin('0')">0</button>
                <button class="num-btn" type="button" style="background:#dc2626; border-color:#ef4444; color:white;" onclick="clearPin()">⌫</button>
            </div>
            <div id="auth-msg" class="auth-msg"></div>
        </div>
    </div>

    <!-- MAIN KITCHEN HEADER -->
    <header>
        <div class="brand-section">
            <div class="brand">ROLAND'S KITCHEN</div>
            <div class="kds-clock" id="live-clock">00:00:00</div>
        </div>
        <div class="metrics-bar">
            <div class="metric-pill total" id="metric-total">0 Active</div>
            <div class="metric-pill pending" id="metric-pending">0 Pending</div>
            <div class="metric-pill cooking" id="metric-cooking">0 Cooking</div>
            <div class="metric-pill ready" id="metric-ready">0 Ready</div>

            <button class="icon-btn" type="button" id="sound-btn" onclick="toggleSound()" title="Toggle Sound Chime">
                🔊 Sound: ON
            </button>
            <button class="icon-btn" type="button" onclick="lockKitchen()" title="Lock Display Gate">
                🔒 Lock Gate
            </button>
        </div>
    </header>

    <!-- FILTER TOOLBAR -->
    <div class="toolbar">
        <div class="filter-tabs">
            <button class="tab-btn active" id="tab-all" type="button" onclick="setFilter('all')">ALL ORDERS</button>
            <button class="tab-btn" id="tab-pending" type="button" onclick="setFilter('pending')">PENDING</button>
            <button class="tab-btn" id="tab-cooking" type="button" onclick="setFilter('cooking')">COOKING</button>
            <button class="tab-btn" id="tab-ready" type="button" onclick="setFilter('ready')">READY</button>
        </div>
        <div style="font-size: 13px; color: var(--kds-text-muted); font-weight: 600;" id="sync-status">
            ● Smart Priority Queue Active (Immediate & Near-Arrival First)
        </div>
    </div>

    <!-- MAIN TICKET GRID CONTAINER -->
    <main class="container">
        <div class="ticket-grid" id="kds-grid">
            <div class="kds-empty">Waiting for food orders...</div>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'https://rolands-steakhouse-vqtr.vercel.app';

        // ── STATE VARIABLES ──
        let currentPin = "";
        let activeFilter = 'all';
        let isSoundEnabled = true;
        let knownActiveTicketIds = null;
        const localKdsShield = {};

        function escapeHtml(str) {
            if (typeof str !== 'string') return String(str || '');
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ── PHYSICAL KEYBOARD LISTENERS FOR PIN GATE ──
        window.addEventListener('keydown', (e) => {
            const gate = document.getElementById('auth-gate');
            if (gate && gate.style.display !== 'none') {
                if (e.key >= '0' && e.key <= '9') {
                    appendPin(e.key);
                } else if (e.key === 'Backspace') {
                    if (currentPin.length > 0) {
                        currentPin = currentPin.slice(0, -1);
                        updatePinDots();
                        document.getElementById('auth-msg').textContent = '';
                    }
                } else if (e.key === 'Escape') {
                    clearPin();
                }
            }
        });

        // ── AUTHENTICATION LOGIC ──
        function appendPin(num) {
            if (currentPin.length >= 4) return;
            currentPin += num;
            updatePinDots();
            if (currentPin.length === 4) checkAuth();
        }

        function clearPin() {
            currentPin = "";
            updatePinDots();
            document.getElementById('auth-msg').textContent = '';
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((d, i) => {
                d.classList.toggle('filled', i < currentPin.length);
            });
        }

        async function checkAuth() {
            const correct = localStorage.getItem('kitchenPassword') || '1234';
            const msg = document.getElementById('auth-msg');

            await new Promise(r => setTimeout(r, 120));

            if (currentPin === correct) {
                sessionStorage.setItem('kitchenAuthenticated', 'true');
                document.getElementById('auth-gate').style.display = 'none';
                initKitchen();
                if (typeof showToast === 'function') {
                    showToast('Kitchen display unlocked', 'success');
                }
            } else {
                msg.textContent = 'Invalid access code. Please try again.';
                clearPin();
                if (typeof showToast === 'function') {
                    showToast('Invalid access code', 'error');
                }
            }
        }

        function lockKitchen() {
            sessionStorage.removeItem('kitchenAuthenticated');
            currentPin = "";
            updatePinDots();
            document.getElementById('auth-msg').textContent = '';
            document.getElementById('auth-gate').style.display = 'flex';
        }

        if (sessionStorage.getItem('kitchenAuthenticated') === 'true') {
            document.getElementById('auth-gate').style.display = 'none';
            initKitchen();
        }

        // ── LIVE CLOCK ──
        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('live-clock');
            if (clockEl) {
                clockEl.textContent = now.toLocaleTimeString();
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const soundBtn = document.getElementById('sound-btn');
            if (soundBtn) {
                soundBtn.textContent = isSoundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
            }
            if (typeof showToast === 'function') {
                showToast(`Kitchen Chime ${isSoundEnabled ? 'Enabled' : 'Muted'}`, 'info');
            }
        }

        function setFilter(filterName) {
            activeFilter = filterName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${filterName}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderKitchenQueue(true);
        }
        
        function getReservationHistory() {
            try {
                return JSON.parse(localStorage.getItem('reservationHistory') || '[]');
            } catch (e) {
                return [];
            }
        }

        // ── SMART TIMING, ARRIVAL WINDOW & PRIORITY ENGINE ──
        function evaluateOrderTimingAndPriority(r) {
            const now = Date.now();
            const resNum = String(r.reservationNumber || '');
            const isPos = r.bookedBy === 'pos' || resNum.startsWith('POS-');
            const isWalkin = r.bookedBy === 'staff' || resNum.startsWith('WI-');
            const isSeated = String(r.approvalStatus || '').toLowerCase() === 'seated' || String(r.status || '').toLowerCase() === 'seated';

            // Parse scheduled arrival date & time
            let arrivalMs = NaN;
            if (r.arrivalDate) {
                const timeStr = (r.arrivalTime && /^\d{1,2}:\d{2}/.test(r.arrivalTime)) ? r.arrivalTime.substring(0, 5) : '12:00';
                const parsed = new Date(`${r.arrivalDate}T${timeStr}:00`);
                if (!isNaN(parsed.getTime())) arrivalMs = parsed.getTime();
            }

            // Format human-readable arrival schedule
            let scheduleLabel = 'Immediate (In-Store)';
            if (!isNaN(arrivalMs)) {
                const arrDateObj = new Date(arrivalMs);
                const nowDateObj = new Date(now);
                const isToday = arrDateObj.toDateString() === nowDateObj.toDateString();
                const tmrwObj = new Date(now);
                tmrwObj.setDate(nowDateObj.getDate() + 1);
                const isTomorrow = arrDateObj.toDateString() === tmrwObj.toDateString();

                const timeFormatted = arrDateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                if (isToday) {
                    scheduleLabel = `Today • ${timeFormatted}`;
                } else if (isTomorrow) {
                    scheduleLabel = `Tomorrow • ${timeFormatted}`;
                } else {
                    const dateFormatted = arrDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    scheduleLabel = `${dateFormatted} • ${timeFormatted}`;
                }
            }

            // Determine Order Origin Label
            let sourceLabel = '⭐ Online Pre-Order';
            if (isPos) sourceLabel = '💵 POS Counter Order';
            else if (isWalkin) sourceLabel = '🚶 Walk-In / Manual';

            // Calculate minutes until arrival (negative means arrival time has passed)
            const minsUntilArrival = !isNaN(arrivalMs) ? Math.round((arrivalMs - now) / 60000) : 0;

            // CASE 1: Immediate Orders (POS, Seated Guests, or Walk-ins arriving within <= 30 mins)
            if (isPos || isSeated || (isWalkin && minsUntilArrival <= 30)) {
                const refIso = r.kdsUpdateAt || r.seatedAt || r.createdAt;
                const refMs = refIso ? new Date(refIso).getTime() : now;
                const elapsedMins = Math.max(0, Math.floor((now - (isNaN(refMs) ? now : refMs)) / 60000));

                let timerHtml = '';
                if (elapsedMins < 10) {
                    timerHtml = `<span class="timer-badge normal">⏱️ ${elapsedMins}m ago</span>`;
                } else if (elapsedMins < 20) {
                    timerHtml = `<span class="timer-badge warning">⏱️ ${elapsedMins}m ago</span>`;
                } else {
                    timerHtml = `<span class="timer-badge urgent">🔥 URGENT ${elapsedMins}m</span>`;
                }

                return {
                    tier: 1, // Highest Priority (Top of Queue)
                    sortScore: -10000 - elapsedMins, // Longest waiting immediate orders first
                    timerHtml,
                    priorityBadgeHtml: `<span class="kds-type-pill now">🔥 ${isSeated ? 'SEATED • COOK NOW' : (isPos ? 'POS • COOK NOW' : 'WALK-IN • COOK NOW')}</span>`,
                    scheduleLabel: isPos ? 'Counter / Dine-In Now' : scheduleLabel,
                    sourceLabel,
                    isFutureScheduled: false
                };
            }

            // CASE 2: Pre-Order or Scheduled Walk-In MORE than 2 hours (120 mins) away
            // Timer does NOT start counting elapsed time yet so cooks don't cook it hours early!
            if (minsUntilArrival > 120) {
                const hours = Math.floor(minsUntilArrival / 60);
                const remMins = minsUntilArrival % 60;
                const countdownText = hours >= 24
                    ? `in ${Math.floor(hours / 24)}d ${hours % 24}h`
                    : `in ${hours}h ${remMins}m`;

                return {
                    tier: 3, // Lowest Priority (Bottom of Queue)
                    sortScore: minsUntilArrival,
                    timerHtml: `<span class="timer-badge scheduled">📅 Starts ${countdownText}</span>`,
                    priorityBadgeHtml: `<span class="kds-type-pill scheduled">🕒 LATER PRE-ORDER (HOLD)</span>`,
                    scheduleLabel,
                    sourceLabel,
                    isFutureScheduled: true
                };
            }

            // CASE 3: Within the 2-Hour Prep Window (0 to 120 mins before arrival)
            if (minsUntilArrival > 0) {
                const hours = Math.floor(minsUntilArrival / 60);
                const remMins = minsUntilArrival % 60;
                const inText = hours > 0 ? `${hours}h ${remMins}m` : `${remMins}m`;

                const isImminent = minsUntilArrival <= 45; // Arriving within 45 mins!
                const timerClass = isImminent ? 'warning' : 'normal';
                const timerIcon = isImminent ? '🔥 Arrives in' : '⏳ Arrives in';

                return {
                    tier: isImminent ? 1 : 2,
                    sortScore: minsUntilArrival,
                    timerHtml: `<span class="timer-badge ${timerClass}">${timerIcon} ${inText}</span>`,
                    priorityBadgeHtml: isImminent
                        ? `<span class="kds-type-pill prep">⚡ ARRIVING SOON • PREP NOW</span>`
                        : `<span class="kds-type-pill prep">⏳ 2H PREP WINDOW</span>`,
                    scheduleLabel,
                    sourceLabel,
                    isFutureScheduled: false
                };
            }

            // CASE 4: Arrival time has arrived or passed (minsUntilArrival <= 0)
            const overdueMins = Math.abs(minsUntilArrival);
            let timerHtml = '';
            if (overdueMins < 10) {
                timerHtml = `<span class="timer-badge normal">⏱️ Due Now (${overdueMins}m)</span>`;
            } else if (overdueMins < 20) {
                timerHtml = `<span class="timer-badge warning">⏱️ Due ${overdueMins}m ago</span>`;
            } else {
                timerHtml = `<span class="timer-badge urgent">🔥 OVERDUE ${overdueMins}m</span>`;
            }

            return {
                tier: 1, // High Priority
                sortScore: -overdueMins,
                timerHtml,
                priorityBadgeHtml: `<span class="kds-type-pill now">🔥 ARRIVAL TIME • COOK NOW</span>`,
                scheduleLabel,
                sourceLabel,
                isFutureScheduled: false
            };
        }

        // ── CLOUD SYNC WITH ANTI-REVERT SHIELD ──
        async function syncKitchenQueueFromCloud() {
            try {
                const res = await fetch(`${API_BASE_URL}/reservations?nocache=${Date.now()}`);
                if (!res.ok) return;
                const dbReservations = await res.json();
                
                let localHistory = getReservationHistory();
                let updated = false;

                const cloudIds = dbReservations.map(dbRes => dbRes.reservationNumber);
                const oldLength = localHistory.length;
                
                localHistory = localHistory.filter(local => cloudIds.includes(local.reservationNumber));
                if (localHistory.length !== oldLength) updated = true;

                dbReservations.forEach(dbRes => {
                    let cloudFoods = dbRes.foods || [];
                    if (cloudFoods.length === 0 && dbRes.cartItems) {
                        try {
                            const parsed = typeof dbRes.cartItems === 'string' ? JSON.parse(dbRes.cartItems) : dbRes.cartItems;
                            if (Array.isArray(parsed)) cloudFoods = parsed.map(i => `${i.quantity}x ${i.name || i.title}`);
                        } catch(e) {}
                    }

                    let match = localHistory.find(local => local.reservationNumber === dbRes.reservationNumber);

                    let rawStatus = dbRes.status || 'Pending';
                    let dbStatus = String(rawStatus).toLowerCase().trim();
                    if (dbStatus === 'walk-in') dbStatus = 'approved';

                    let cloudKds = String(dbRes.kdsStatus || 'pending').toLowerCase().trim();
                    if (dbStatus === 'completed') cloudKds = 'served';
                    if (dbStatus === 'cancelled' || dbStatus === 'rejected') cloudKds = 'cancelled';

                    const shield = localKdsShield[dbRes.reservationNumber];
                    const isShieldActive = shield && (Date.now() - shield.timestamp < 15000);

                    if (match) {
                        if (match.customerName !== dbRes.customerName) {
                            match.customerName = dbRes.customerName;
                            updated = true;
                        }
                        if (dbRes.bookedTable && match.bookedTable !== dbRes.bookedTable) {
                            match.bookedTable = dbRes.bookedTable;
                            updated = true;
                        }
                        if (dbRes.arrivalDate && match.arrivalDate !== dbRes.arrivalDate) {
                            match.arrivalDate = dbRes.arrivalDate;
                            updated = true;
                        }
                        if (dbRes.arrivalTime && match.arrivalTime !== dbRes.arrivalTime) {
                            match.arrivalTime = dbRes.arrivalTime;
                            updated = true;
                        }

                        if (!isShieldActive) {
                            const recentlyTouchedLocally = match.localUpdatedAt && (Date.now() - match.localUpdatedAt < 15000);

                            if (!recentlyTouchedLocally) {
                                if (dbStatus !== 'pending' && String(match.approvalStatus).toLowerCase() !== dbStatus) {
                                    match.approvalStatus = dbStatus;
                                    if (dbStatus === 'approved' || dbStatus === 'seated' || dbStatus === 'completed') {
                                        match.paymentStatus = 'verified';
                                    }
                                    if (dbStatus === 'completed' && !match.completedAt) {
                                        match.completedAt = new Date().toISOString();
                                    }
                                    updated = true;
                                }

                                if (cloudKds && match.kdsStatus !== cloudKds) {
                                    match.kdsStatus = cloudKds;
                                    updated = true;
                                }
                            }
                        } else {
                            if (match.kdsStatus !== shield.status) {
                                match.kdsStatus = shield.status;
                                updated = true;
                            }
                        }

                        if (cloudFoods.length > 0 && JSON.stringify(match.foods) !== JSON.stringify(cloudFoods)) { 
                            match.foods = cloudFoods; 
                            updated = true; 
                        }
                        if (match.paymentAmount !== dbRes.paymentAmount) { 
                            match.paymentAmount = dbRes.paymentAmount || 0; 
                            updated = true; 
                        }
                        if (match.reservationType !== dbRes.reservationType) { 
                            match.reservationType = dbRes.reservationType || 'standard'; 
                            updated = true; 
                        }
                        if (dbRes.bookedBy === 'pos' && match.paymentStatus === 'pending') {
                            match.paymentStatus = 'verified';
                            updated = true;
                        }

                    } else {
                        if (dbStatus === 'completed' || dbStatus === 'cancelled' || dbStatus === 'rejected') return;
                        if (cloudKds === 'served' || cloudKds === 'cancelled') return;

                        localHistory.push({
                            reservationNumber: dbRes.reservationNumber,
                            reservationType: dbRes.reservationType || 'standard',
                            customerName: dbRes.customerName,
                            bookedTable: dbRes.bookedTable,
                            arrivalDate: dbRes.arrivalDate,
                            arrivalTime: dbRes.arrivalTime,
                            arrivalDateTimeDisplay: `${dbRes.arrivalDate} ${dbRes.arrivalTime}`,
                            approvalStatus: dbStatus,
                            paymentStatus: (dbStatus === 'completed' || dbStatus === 'approved' || dbStatus === 'seated' || dbRes.bookedBy === 'pos') ? 'verified' : 'pending',
                            kdsStatus: isShieldActive ? shield.status : cloudKds,
                            completedAt: dbStatus === 'completed' ? new Date().toISOString() : null,
                            createdAt: new Date().toISOString(),
                            foods: cloudFoods, 
                            paymentAmount: dbRes.paymentAmount || 0,
                            bookedBy: dbRes.bookedBy 
                        });
                        updated = true;
                    }
                });

                if (updated) {
                    localStorage.setItem('reservationHistory', JSON.stringify(localHistory));
                }
                // Always re-render so live countdown/elapsed timers tick every 5 seconds
                renderKitchenQueue(!updated);
            } catch (e) {
                console.error("Kitchen cloud sync error:", e);
            }
        }

        function initKitchen() {
            renderKitchenQueue(true);
            syncKitchenQueueFromCloud();
            setInterval(() => {
                syncKitchenQueueFromCloud();
            }, 5000);
        }

        // ── TICKET CARD BUILDER HELPER ──
        function buildTicketCard(r) {
            const resNo = String(r.reservationNumber || '').replace(/^WI-WI-/i, 'WI-');
            const rawResKey = String(r.reservationNumber || '');
            const safeResNoJs = rawResKey.replace(/'/g, "\\'");
            const status = r.kdsStatus || 'pending';

            const timing = r._timing || evaluateOrderTimingAndPriority(r);

            const t = document.createElement('div');
            t.className = `ticket status-${status}${timing.isFutureScheduled && status === 'pending' ? ' is-future-scheduled' : ''}`;
            
            const foodsHtml = (r.foods || []).map(f => {
                const match = String(f).match(/^(\d+x)\s+(.*)/);
                if (match) {
                    return `<li><span class="qty-tag">${escapeHtml(match[1])}</span> <span>${escapeHtml(match[2])}</span></li>`;
                }
                return `<li><span class="qty-tag">1x</span> <span>${escapeHtml(String(f))}</span></li>`;
            }).join('');
            
            let donenessHtml = '';
            if (r.beefNote && r.beefNote.trim() !== '[[KITCHEN_TIMING: SERVE UPON ARRIVAL]]') {
                // Split the combined note into readable parts
                const raw = String(r.beefNote);
                const timingMatch = raw.match(/\[\[KITCHEN_TIMING:\s*([^\]]+)\]\]/i);
                const timing = timingMatch ? timingMatch[1].trim() : '';
                const withoutTiming = raw.replace(/\[\[KITCHEN_TIMING:[^\]]+\]\]/gi, '').trim();
                const parts = withoutTiming.split('|').map(p => p.trim()).filter(Boolean);

                const donenessPart = parts.find(p => /^doneness:/i.test(p));
                const otherParts = parts.filter(p => !/^doneness:/i.test(p));
                const doneness = donenessPart ? donenessPart.replace(/^doneness:\s*/i, '').trim() : '';

                let badge = '';
                if (doneness) badge += `🔥 DONENESS: ${escapeHtml(doneness.toUpperCase())}`;
                if (timing) badge += `${badge ? '<br>' : ''}⏱️ KITCHEN TIMING: ${escapeHtml(timing.toUpperCase())}`;
                if (otherParts.length) badge += `${badge ? '<br>' : ''}📝 ${escapeHtml(otherParts.join(' · ').toUpperCase())}`;

                if (badge) donenessHtml = `<div class="doneness-badge">${badge}</div>`;
            }
            
            let detailHtml = '';
            if (r.notes) {
                detailHtml += `<div class="ticket-notes">📝 <strong>Note:</strong> ${escapeHtml(r.notes)}</div>`;
            }
            
            let btns = '';
            if (status === 'pending') {
                btns = `
                    <div class="action-row">
                        <button class="btn-cook" type="button" onclick="updateStatus('${safeResNoJs}', 'cooking')">🔥 START COOKING</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-cancel" type="button" onclick="cancelOrder('${safeResNoJs}')">Cancel Order</button>
                    </div>
                `;
            } else if (status === 'cooking') {
                btns = `
                    <div class="action-row">
                        <button class="btn-ready" type="button" onclick="updateStatus('${safeResNoJs}', 'ready')">✔ MARK AS DONE</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-cancel" type="button" onclick="cancelOrder('${safeResNoJs}')">Cancel Order</button>
                    </div>
                `;
            } else if (status === 'ready') {
                btns = `
                    <div class="action-row">
                        <button class="btn-dismiss" type="button" onclick="updateStatus('${safeResNoJs}', 'served')">🍽️ SERVED / DISMISS</button>
                    </div>
                `;
            }

            const tableText = r.bookedTable ? (r.bookedTable.toLowerCase().includes('table') || r.bookedTable.toLowerCase().includes('vip') ? r.bookedTable.toUpperCase() : `TABLE ${r.bookedTable}`) : 'WALK-IN';
            const guestBadge = r.guestCount ? `<span>👥 ${escapeHtml(String(r.guestCount))} Guests</span>` : '';

            t.innerHTML = `
                <div class="ticket-header">
                    <div>
                        <div class="table-badge">${escapeHtml(tableText)}</div>
                        <div class="customer-name">${escapeHtml(r.customerName || 'Guest')}</div>
                        <div style="font-size: 11px; color: var(--kds-text-muted); margin-top: 2px;">#${escapeHtml(resNo || 'N/A')}</div>
                    </div>
                    <div class="ticket-meta">
                        ${timing.timerHtml}
                        <span class="status-badge ${status}">${status}</span>
                    </div>
                </div>

                <!-- 👉 NEW: Reservation Timing & Priority Details Box -->
                <div class="kds-res-info-box">
                    <div class="kds-res-row">
                        ${timing.priorityBadgeHtml}
                        <span style="color:#cbd5e1; font-weight:700;">${escapeHtml(timing.sourceLabel)}</span>
                    </div>
                    <div class="kds-res-row" style="color:#94a3b8; font-weight:600;">
                        <span>🗓️ Arrival: <strong style="color:#f8fafc;">${escapeHtml(timing.scheduleLabel)}</strong></span>
                        ${guestBadge}
                    </div>
                </div>

                ${donenessHtml}
                <ul class="food-list">${foodsHtml}</ul>
                ${detailHtml}
                <div class="actions">${btns}</div>
            `;
            return t;
        }

        // ── MAIN QUEUE RENDERER (With Smart Priority Sorting) ──
        function renderKitchenQueue(silent = false) {
            const hist = getReservationHistory();
            const grid = document.getElementById('kds-grid');
            if (!grid) return;

            // 1. Filter active kitchen food orders
            let foodOrders = hist.filter(r => {
                if (!r || !Array.isArray(r.foods) || r.foods.length === 0) return false;

                const kds = String(r.kdsStatus || 'pending').toLowerCase().trim();
                const aStat = String(r.approvalStatus || '').toLowerCase().trim();
                const dbStat = String(r.status || '').toLowerCase().trim();
                const pStat = String(r.paymentStatus || '').toLowerCase().trim();
                const resNum = String(r.reservationNumber || '');

                if (kds === 'served' || kds === 'cancelled') return false;
                if (Boolean(r.completedAt) || Boolean(r.cancelledAt) || r.isCancelled === true) return false;
                if (aStat === 'completed' || aStat === 'cancelled' || aStat === 'rejected') return false;
                if (dbStat === 'completed' || dbStat === 'cancelled' || dbStat === 'rejected') return false;
                if (pStat === 'rejected' || pStat === 'refunded') return false;

                if (r.bookedBy === 'pos' || resNum.startsWith('POS-')) return true;

                return (
                    aStat === 'approved' ||
                    aStat === 'seated' ||
                    dbStat === 'approved' ||
                    dbStat === 'seated' ||
                    pStat === 'verified' ||
                    pStat === 'paid' ||
                    pStat === 'walk-in'
                );
            });

            // 2. Attach Smart Timing & Sort by Priority!
            // Tier 1 (POS / Walk-in / Seated / Imminent Arrival) -> Tier 2 (Within 2h Prep Window) -> Tier 3 (Later Today / Tomorrow)
            foodOrders = foodOrders.map(r => ({
                ...r,
                _timing: evaluateOrderTimingAndPriority(r)
            })).sort((a, b) => {
                if (a._timing.tier !== b._timing.tier) {
                    return a._timing.tier - b._timing.tier;
                }
                return a._timing.sortScore - b._timing.sortScore;
            });

            // 3. New-Order Sound Trigger
            const currentIds = new Set(foodOrders.map(o => o.reservationNumber));
            if (knownActiveTicketIds !== null && !silent) {
                const hasBrandNewOrder = foodOrders.some(o => !knownActiveTicketIds.has(o.reservationNumber));
                if (hasBrandNewOrder && isSoundEnabled) {
                    playNewOrderChime();
                    showNewOrderPopup();
                }
            }
            knownActiveTicketIds = currentIds;

            // 4. Metrics Update
            const pendingOrders = foodOrders.filter(o => !o.kdsStatus || o.kdsStatus === 'pending');
            const cookingOrders = foodOrders.filter(o => o.kdsStatus === 'cooking');
            const readyOrders   = foodOrders.filter(o => o.kdsStatus === 'ready');

            document.getElementById('metric-total').textContent = `${foodOrders.length} Active`;
            document.getElementById('metric-pending').textContent = `${pendingOrders.length} Pending`;
            document.getElementById('metric-cooking').textContent = `${cookingOrders.length} Cooking`;
            document.getElementById('metric-ready').textContent = `${readyOrders.length} Ready`;

            // 5. Render 3-Column Board View
            if (activeFilter === 'all') {
                grid.className = 'kds-board';
                grid.innerHTML = `
                    <!-- PENDING ORDERS AREA -->
                    <div class="kds-column col-pending">
                        <div class="kds-col-header">
                            <div class="kds-col-title"><span class="col-icon">📥</span> PENDING ORDERS</div>
                            <span class="kds-col-badge">${pendingOrders.length} Waiting</span>
                        </div>
                        <div class="kds-col-body" id="col-body-pending"></div>
                    </div>

                    <!-- NOW COOKING AREA -->
                    <div class="kds-column col-cooking">
                        <div class="kds-col-header">
                            <div class="kds-col-title"><span class="col-icon">🍳</span> NOW COOKING</div>
                            <span class="kds-col-badge">${cookingOrders.length} On Grill</span>
                        </div>
                        <div class="kds-col-body" id="col-body-cooking"></div>
                    </div>

                    <!-- READY FOR SERVICE AREA -->
                    <div class="kds-column col-ready">
                        <div class="kds-col-header">
                            <div class="kds-col-title"><span class="col-icon">🔔</span> READY TO SERVE</div>
                            <span class="kds-col-badge">${readyOrders.length} Ready</span>
                        </div>
                        <div class="kds-col-body" id="col-body-ready"></div>
                    </div>
                `;

                const bodyPending = document.getElementById('col-body-pending');
                const bodyCooking = document.getElementById('col-body-cooking');
                const bodyReady   = document.getElementById('col-body-ready');

                if (pendingOrders.length === 0) {
                    bodyPending.innerHTML = `<div class="kds-col-empty"><div class="kds-col-empty-icon">⏳</div>No pending orders waiting</div>`;
                } else {
                    pendingOrders.forEach(r => bodyPending.appendChild(buildTicketCard(r)));
                }

                if (cookingOrders.length === 0) {
                    bodyCooking.innerHTML = `<div class="kds-col-empty"><div class="kds-col-empty-icon">🍳</div>No orders currently cooking<br><span style="font-size:12px; opacity:0.75; margin-top:4px;">Press "START COOKING" on any pending order</span></div>`;
                } else {
                    cookingOrders.forEach(r => bodyCooking.appendChild(buildTicketCard(r)));
                }

                if (readyOrders.length === 0) {
                    bodyReady.innerHTML = `<div class="kds-col-empty"><div class="kds-col-empty-icon">✅</div>No orders ready for pickup</div>`;
                } else {
                    readyOrders.forEach(r => bodyReady.appendChild(buildTicketCard(r)));
                }
                return;
            }

            // Single Tab Filter View
            grid.className = 'ticket-grid';
            const filteredOrders = foodOrders.filter(o => (o.kdsStatus || 'pending') === activeFilter);

            if (filteredOrders.length === 0) {
                grid.innerHTML = `<div class="kds-empty">No ${activeFilter.toUpperCase()} food orders in kitchen queue.</div>`;
                return;
            }

            grid.innerHTML = '';
            filteredOrders.forEach(r => {
                grid.appendChild(buildTicketCard(r));
            });
        }

        // ── SOUND & POPUP NOTIFICATIONS ──
        function playNewOrderChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function showNewOrderPopup() {
            const div = document.createElement('div');
            div.className = 'new-order-popup';
            div.innerHTML = '🔔 NEW KITCHEN ORDER RECEIVED!';
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = '0.5s';
                setTimeout(() => div.remove(), 500);
            }, 3500);
        }

        // ── UPDATE TICKET STATUS ──
        async function updateStatus(resNo, newStatus) {
            const hist = getReservationHistory();
            const idx = hist.findIndex(r => String(r.reservationNumber) === String(resNo));
            if (idx === -1) return;

            const now = Date.now();
            localKdsShield[resNo] = { status: newStatus, timestamp: now };

            hist[idx].kdsStatus = newStatus;
            hist[idx].kdsUpdateAt = new Date().toISOString();
            hist[idx].localUpdatedAt = now;

            if (newStatus === 'served') {
                hist[idx].approvalStatus = 'seated';
                
                const bookedTable = hist[idx].bookedTable;
                if (bookedTable && bookedTable !== 'Takeout') {
                    const overrides = JSON.parse(localStorage.getItem('tableOverrides') || '{}');
                    overrides[bookedTable] = 'seated';
                    localStorage.setItem('tableOverrides', JSON.stringify(overrides));
                    
                    fetch(`${API_BASE_URL}/api/memory/table-overrides`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(overrides)
                    }).catch(() => {});

                    try {
                        if (typeof BroadcastChannel !== 'undefined') {
                            new BroadcastChannel('inventory_sync_channel').postMessage({ action: 'tableOverridesUpdated', payload: overrides });
                        }
                    } catch (e) {}
                }
            }

            localStorage.setItem('reservationHistory', JSON.stringify(hist));
            renderKitchenQueue(true);

            if (typeof showToast === 'function') {
                const label = newStatus === 'cooking' ? 'Started Cooking 🔥' : (newStatus === 'ready' ? 'Marked Ready to Serve 🔔' : 'Order Served & Dismissed ✅');
                showToast(`#${resNo}: ${label}`, 'success');
            }

            try {
                window.dispatchEvent(new CustomEvent('reservationHistoryUpdated', { detail: hist }));
                if (typeof BroadcastChannel !== 'undefined') {
                    new BroadcastChannel('inventory_sync_channel').postMessage({ action: 'reservationHistoryUpdated', payload: hist });
                }
            } catch (e) {}

            try {
                await fetch(`${API_BASE_URL}/api/reservations/update-kds`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: resNo, kdsStatus: newStatus })
                });

                if (newStatus === 'served') {
                    await fetch(`${API_BASE_URL}/api/reservations/update-status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: resNo, status: 'Seated' })
                    });
                }
            } catch (e) {
                console.error('Failed to push KDS update to cloud:', e);
            }
        }

        // ── CANCEL ORDER FROM KITCHEN ──
        window.cancelOrder = async function(resNo) {
            let confirmed = false;
            if (typeof superModal === 'function') {
                confirmed = await superModal({
                    title: `Cancel Order #${resNo}? ❌`,
                    message: 'Are you sure you want to cancel this order? It will be removed from the kitchen queue and ingredients will be returned to stock.',
                    type: 'confirm'
                });
            } else {
                confirmed = confirm(`Are you sure you want to cancel order #${resNo}?`);
            }
            
            if (!confirmed) return;

            const hist = getReservationHistory();
            const idx = hist.findIndex(r => String(r.reservationNumber) === String(resNo));
            if (idx === -1) return;

            const targetRes = hist[idx];
            const now = Date.now();
            localKdsShield[resNo] = { status: 'cancelled', timestamp: now };

            if (window.InventorySystem && typeof window.InventorySystem.cancelReservationWithFood === 'function') {
                window.InventorySystem.cancelReservationWithFood({
                    reservationNumber: targetRes.reservationNumber,
                    reason: 'Cancelled by Kitchen Staff',
                    cancelledBy: 'kitchen',
                    operator: 'Kitchen Terminal'
                });
            }

            targetRes.kdsStatus = 'cancelled';
            targetRes.approvalStatus = 'cancelled';
            targetRes.paymentStatus = 'rejected';
            targetRes.completedAt = new Date().toISOString();
            targetRes.localUpdatedAt = now;

            localStorage.setItem('reservationHistory', JSON.stringify(hist));
            renderKitchenQueue(true);

            if (typeof showToast === 'function') {
                showToast(`Order #${resNo} cancelled.`, 'success');
            }

            try {
                window.dispatchEvent(new CustomEvent('reservationHistoryUpdated', { detail: hist }));
                if (typeof BroadcastChannel !== 'undefined') {
                    new BroadcastChannel('inventory_sync_channel').postMessage({ action: 'reservationHistoryUpdated', payload: hist });
                }
            } catch (e) {}

            try {
                await Promise.all([
                    fetch(`${API_BASE_URL}/api/reservations/update-kds`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: resNo, kdsStatus: 'cancelled' })
                    }),
                    fetch(`${API_BASE_URL}/api/reservations/update-status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: resNo, status: 'Cancelled' })
                    })
                ]);
            } catch (e) {}
        };
        
        // ── REAL-TIME EVENT LISTENERS ──
        window.addEventListener('storage', (e) => {
            if (e.key === 'reservationHistory' || e.key === 'tableOverrides') {
                renderKitchenQueue(true);
            }
            if (e.key === 'kitchenPassword') {
                sessionStorage.removeItem('kitchenAuthenticated');
                window.location.reload();
            }
        });

        try {
            if (typeof BroadcastChannel !== 'undefined') {
                const kdsChannel = new BroadcastChannel('inventory_sync_channel');
                kdsChannel.onmessage = function (e) {
                    if (e.data && (e.data.action === 'reservationHistoryUpdated' || e.data.action === 'tableOverridesUpdated')) {
                        renderKitchenQueue(true);
                    }
                };
            }
        } catch (e) {}
    </script>
